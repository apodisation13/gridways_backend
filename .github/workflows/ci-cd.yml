name: AUTO ci-cd gridways backend

on:
  pull_request:
    branches: [ main, testing ]
    types: [opened, synchronize, closed]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}


jobs:
  # ==========================================
  # 🔍 ВАЛИДАЦИЯ PR (только при открытии/обновлении)
  # ==========================================
  validate-pr:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    outputs:
      pr_valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Проверяем правила Pull Request
        id: validate
        run: |
          echo "🔍 Проверяем правила Pull Request..."
          echo "Целевая ветка: ${{ github.base_ref }}"
          echo "Исходная ветка: ${{ github.head_ref }}"

          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "testing" ]]; then
            echo "❌ PR to main can only be from testing branch"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ PR валиден"
          echo "valid=true" >> $GITHUB_OUTPUT

  # ==========================================
  # 🧪 ТЕСТЫ И ЛИНТЕРЫ (только при открытии/обновлении)
  # ==========================================
  linters-and-tests:
    needs: validate-pr
    if: |
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      needs.validate-pr.outputs.pr_valid == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r lib/requirements-dev.txt
        pip install -r services/api/requirements.txt
        pip install -r services/frontend_logs/requirements.txt
        pip install -r services/cron/requirements.txt
        pip install -r services/events/requirements.txt
        pip install -r services/migrant/requirements.txt
        pip install -r services/rest/requirements.txt
        pip install -r services/ws/requirements.txt

    - name: Create test environment file
      run: |
        cat > .env << EOF
        CONFIG=test_local
        TEST_DB_PASSWORD=postgres_password
        EOF
        echo "✅ Created .env file"

    - name: Run ruff check
      run: |
        echo "🔍 Checking code with ruff..."

        echo "📋 Running ruff check..."
        ruff check .
        if [ $? -ne 0 ]; then
          echo "❌ Linting issues found!"
          echo "Please run 'ruff check --fix .' locally and commit the changes"
          exit 1
        fi
        echo "✅ Linting passed"

        echo "📋 Running ruff format check..."
        ruff format --check .
        if [ $? -ne 0 ]; then
          echo "❌ Code formatting issues found!"
          echo "Please run 'ruff format .' locally and commit the changes"
          exit 1
        fi
        echo "✅ Code formatting is correct"

        echo "🎉 All checks passed!"

    - name: Run tests
      run: |
        pytest -s -vv

  # ==========================================
  # 🔎 АНАЛИЗ ИЗМЕНЕНИЙ (при открытии/обновлении после тестов; при мердже — сразу)
  # ==========================================
  analyze-changes:
    needs: linters-and-tests
    if: |
      always() &&
      (
        needs.linters-and-tests.result == 'success' ||
        (github.event.action == 'closed' && github.event.pull_request.merged == true)
      )
    runs-on: ubuntu-latest
    outputs:
      services_to_build: ${{ steps.detect.outputs.services }}
      build_all: ${{ steps.detect.outputs.build_all }}

    steps:
      - name: Получаем код
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Анализируем изменения
        id: detect
        run: |
          echo "🔍 Анализируем что изменилось в PR..."

          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          echo "📄 Измененные файлы:"
          echo "$CHANGED_FILES"
          echo ""

          # ПРАВИЛО 1: Игнорируем если только тесты
          ONLY_TESTS=true
          for file in $CHANGED_FILES; do
            if [[ ! $file =~ /tests/ ]] && [[ ! $file =~ ^lib/tests/ ]]; then
              ONLY_TESTS=false
            fi
          done

          if [[ "$ONLY_TESTS" == "true" ]]; then
            echo "📝 Только тесты изменены — при мердже ничего не будем билдить"
            echo "services=" >> $GITHUB_OUTPUT
            echo "build_all=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ПРАВИЛО 2: Проверяем lib/utils (кроме models)
          LIB_UTILS_CHANGED=false
          for file in $CHANGED_FILES; do
            if [[ $file =~ ^lib/utils/ ]] && [[ ! $file =~ ^lib/utils/models/ ]]; then
              LIB_UTILS_CHANGED=true
            fi
          done

          if [[ "$LIB_UTILS_CHANGED" == "true" ]]; then
            echo "📚 Изменены общие утилиты — при мердже будем билдить ВСЕ сервисы"
            echo "build_all=true" >> $GITHUB_OUTPUT
            echo "services=migrant api frontend_logs rest events cron ws" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ПРАВИЛО 3: Определяем измененные сервисы
          echo "🔎 Ищем измененные микросервисы..."
          CHANGED_SERVICES=""
          ALL_SERVICES=("migrant" "api" "frontend_logs" "rest" "events" "cron" "ws")

          for service in "${ALL_SERVICES[@]}"; do
            for file in $CHANGED_FILES; do
              if [[ $file =~ ^services/$service/ ]] && [[ ! $file =~ ^services/$service/tests/ ]]; then
                echo "✅ Сервис '$service' изменился"
                CHANGED_SERVICES="$CHANGED_SERVICES $service"
                break
              fi
            done
          done

          CHANGED_SERVICES="${CHANGED_SERVICES# }"
          echo "📦 Сервисы для сборки при мердже: $CHANGED_SERVICES"
          echo "services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
          echo "build_all=false" >> $GITHUB_OUTPUT

  # ==========================================
  # 🚀 БИЛД И ДЕПЛОЙ (только при мердже, после analyze-changes)
  # ==========================================
  build-and-deploy:
    needs: [analyze-changes]
    if: |
      always() &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      needs.analyze-changes.result == 'success' &&
      needs.analyze-changes.outputs.services_to_build != ''
    runs-on: ubuntu-latest

    environment: ${{ github.base_ref == 'main' && 'production' || 'testing' }}
    env:
      MODE: ${{ github.base_ref == 'main' && 'production' || 'testing' }}
      SERVICES: ${{ needs.analyze-changes.outputs.services_to_build }}

    steps:
      - name: 📥 Получаем код
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: 🔐 Логин в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Создаем .env из Environment secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "$SECRETS_JSON" \
            | jq -r 'to_entries | map(select(.key != "GITHUB_TOKEN")) | .[] | "\(.key)=\(.value | @json)"' \
            > .env
          cp .env .env.docker
          echo "✅ .env и .env.docker созданы для Environment: ${{ env.MODE }}"

      - name: 🔨 Билдим изменённые сервисы
        run: |
          export TAG="${{ env.MODE }}"
          echo "🚀 Билдим: ${{ env.SERVICES }}"
          echo "🏷️ Тег: $TAG"
          docker compose build ${{ env.SERVICES }}

      - name: 📤 Пушим образы в registry
        run: |
          export TAG="${{ env.MODE }}"
          echo "📤 Пушим образы: ${{ env.SERVICES }}"
          docker compose push ${{ env.SERVICES }}
          echo "✅ Все образы в registry!"

      - name: Send docker-compose
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yaml,nginx/nginx.conf,.env.docker"
          target: "/srv/cardgame/backend/${{ env.MODE }}"

      - name: 🚀 Деплой на сервер
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ env.MODE }}
          MODE: ${{ env.MODE }}
          SERVICES: ${{ env.SERVICES }}
          BACKEND_IMAGE_NAME: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: MODE,TAG,SERVICES,BACKEND_IMAGE_NAME
          script: |
            export TAG="$TAG"
            export MODE="$MODE"
            export BACKEND_IMAGE_NAME="$BACKEND_IMAGE_NAME"

            cd /srv/cardgame/backend/$MODE

            echo "📥 Логинимся в registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Пуллим образы: $SERVICES"
            docker-compose pull $SERVICES

            echo "🔄 Перезапускаем сервисы..."
            docker-compose --env-file .env.docker up -d $SERVICES

            echo "🧹 Чистим старые образы..."
            docker image prune -f

            docker restart gridways-nginx

            echo ""
            echo "✅ Деплой завершён!"
            docker-compose ps

      - name: 📋 Итог
        run: |
          echo "=========================================="
          echo "✅ Автоматический деплой завершён!"
          echo "Окружение: ${{ env.MODE }}"
          echo "Сервисы:   ${{ env.SERVICES }}"
          echo "=========================================="